<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>claude-page-comments demo</title>
    <style>
      body { margin: 0; font: 16px/1.5 system-ui, sans-serif; }
      main { height: 100vh; overflow: auto; padding: 32px; }
      .card { max-width: 520px; margin: 0 0 24px; padding: 20px; border: 1px solid #ddd; border-radius: 10px; }
      button.primary { padding: 8px 14px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; }
    </style>
  </head>
  <body>
    <main>
      <h1>Demo page</h1>
      <p>Press the first icon at the bottom right (or Ctrl+C), drag an area, write what to change.</p>
      <div class="card"><h2>Pricing</h2><p>Simple plans for small teams.</p><button class="primary">Start now</button></div>
      <div class="card"><h2>About</h2><p>We build small tools that do one thing well.</p></div>
      <div class="card"><h2>Contact</h2><p>hello@example.com</p></div>
      <div style="height: 600px"></div>
    </main>
  </body>
</html>
